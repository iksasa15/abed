<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var loc = localStorage.getItem('abeer-locale')
          if (loc === 'en') {
            document.documentElement.setAttribute('lang', 'en')
            document.documentElement.setAttribute('dir', 'ltr')
          }
          var theme = localStorage.getItem('abeer-theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta id="theme-color-meta" name="theme-color" content="#E8EEF8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="عبير اليعيش — بورتفوليو علوم حاسب، ذكاء اصطناعي، ومنتجات رقمية."
    />
    <title>عبير اليعيش</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
